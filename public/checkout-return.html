<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox payment · PayHealth</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="wrap narrow">
    <div class="card">
      <h1 id="title" style="font-size:1.4rem;margin-top:0">Payment approved</h1>
      <p id="msg">Go back to PowerShell and press Enter. The script will finish the payment.</p>
      <p class="muted small">Sandbox test only. No real money moves.</p>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("cancelled")) {
      document.getElementById("title").textContent = "Payment cancelled";
      document.getElementById("msg").textContent = "Nothing was paid. Run the script again to try once more.";
    }
  </script>
</body>
</html>
